<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cuan</title>
    <link rel="stylesheet" href="css/register.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container">
        <form class="register-box">
            <img class="logo" src="assets/logo.png" alt=""/>
            <h1>E-Cuan</h1>
            <p class="pendukung">Cara Sederhana Mengelola Uang</p>
            <p>Nama Lengkap :</p>
            <input type="text" placeholder="Nama Lengkap" required id="nama">
            <p>Username :</p>
            <input type="text" placeholder="Username" required id="username">
            <p>Password :</p>
            <input type="password" placeholder="Password" required id="password">
            <input type="password" placeholder="Confirm Password" required id="confirmPassword">
            <button type="submit">Register</button>
            <p class="sdh-rgs">Sudah Memiliki Akun? <a href="./login.html">login</a></p>
        </form>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
